name: Docs

# Builds the documentation site (docs/). On pull requests it also checks
# that the generated API pages match the docstrings in src/; on main it
# deploys the site to GitHub Pages.
on:
  push:
    branches: ["main"]
    paths: ["docs/**", "src/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "src/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # griffe reads the source without importing it, so the project's
      # dependencies (PyTorch, ...) aren't needed here.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The site is always built from freshly generated API pages, so it's
      # never stale. The committed copies (for `npm start` without Python) can
      # lag behind when code in src/ moves, e.g. source line numbers; that's
      # only a warning, so a code change elsewhere can't block the docs.
      - name: Regenerate the API pages
        run: |
          pip install "griffelib>=2.4.1,<3"
          python docs/scripts/gen_api.py
          if ! git diff --quiet -- docs/docs/api; then
            echo "::warning::The committed API pages differ from the docstrings in src/. The site uses fresh ones; to update the committed copies, run 'poetry run npm run api --prefix docs' and commit the result."
            git diff --stat -- docs/docs/api
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build the site
        working-directory: docs
        run: |
          npm ci
          npm run build

      # Opens every page of the built site, directly and through in-app
      # navigation, and fails on script errors, missing chunks or broken requests.
      - name: Test the built site
        working-directory: docs
        run: |
          npx playwright install --with-deps chromium
          npm run test:site

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
