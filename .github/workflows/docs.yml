name: Docs

# Builds the documentation site (website/). On pull requests it also checks
# that the generated API pages match the docstrings in src/; on main it
# deploys the site to GitHub Pages.
on:
  push:
    branches: ["main"]
    paths: ["website/**", "src/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["website/**", "src/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # griffe reads the source without importing it, so the project's
      # dependencies (PyTorch, ...) aren't needed here.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate the API pages
        run: |
          pip install "griffelib>=2.4.1,<3"
          python website/scripts/gen_api.py

      - name: Check the API pages are up to date
        run: |
          if ! git diff --exit-code -- website/docs/api; then
            echo "::error::The API pages are out of date. Run 'poetry run npm run api --prefix website' and commit the result."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build the site
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
