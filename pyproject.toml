[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=2,<3" ]

[project]
name = "photorealistic-street-maps"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
  { name = "Ashp116", email = "ashp116@outlook.com" },
  { name = "Kovidh Maydiga", email = "kmaydiga@umich.edu" },
  { name = "Aadi Ghai", email = "aadighai@umich.edu" },
  { name = "Mizuki Kuno", email = "mizuki@umich.edu" },
  { name = "Anthony Chen", email = "anthoc@umich.edu" },
  { name = "Dervin Tian", email = "dervint@umich.edu" },
  { name = "Allison Du", email = "allial.du@gmail.com" },
]
requires-python = ">=3.11,<3.15,!=3.14.1"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "dotenv>=0.9.9,<0.10",
  "fastapi>=0.115,<1",
  # GeoCalib and LightGlue (ALIKED): the --poses colmap alignment; not on PyPI
  "geocalib @ git+https://github.com/cvg/GeoCalib",
  "lightglue @ git+https://github.com/cvg/LightGlue.git",
  "mapbox-earcut>=2.1,<3",
  "mapillary>=1.0.15,<2",
  "matplotlib>=3.10.8,<4",
  "networkx>=3.6.1,<4",
  "numpy>=2.4.3,<3",
  "opencv-python>=4.13.0.92,<5",
  "pillow>=12.1.1,<13",
  "pint>=0.25.2,<0.26",
  "pyproj>=3.7.2,<4",
  "requests>=2.32.5,<3",
  "rtree>=1.4.1,<2",
  "simple-lama-inpainting>=0.1",
  # 2.11-2.13 match ALIKED features several times slower on Apple GPUs (MPS); with 2.15,
  # torchvision 0.29's MPS kernels fail (deform_conv2d in ALIKED)
  "torch>=2.14,<2.15",
  "tqdm>=4.67.3,<5",
  "transformers>=4.45,<5",
  "trimesh>=4.11.3,<5",
  "uvicorn>=0.30,<1",
  "websockets>=13,<18"
]

[dependency-groups]
dev = [
  "griffelib>=2.4.1,<3",
  "httpx>=0.27,<1",
  "pre-commit>=4.3,<5",
  "pytest>=9.0.2,<10",
  "ruff>=0.15.5,<0.16",
]

[tool.poetry]
packages = [ { include = "photorealistic_street_maps", from = "src" } ]
package-mode = false

[tool.pyright]
extraPaths = [ "src" ]

[tool.pytest]
ini_options.pythonpath = [ "src" ]
ini_options.testpaths = [ "tests" ]
